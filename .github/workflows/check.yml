name: Checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          cache: true
      - run: bash tool/check.sh
      - run: cd apps/mobile && flutter build web --release --no-pub
      - run: python3 tool/test_backup.py
      - run: bash tool/build_merchant_web.sh --no-pub
      - run: bash tool/build_admin_web.sh --no-pub
      - run: docker build -f apps/api/Dockerfile -t nevyhadzuj-api:ci .
