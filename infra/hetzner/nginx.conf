worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format safe '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    resolver 127.0.0.11 valid=10s ipv6=off;
    ssl_certificate /tls/fullchain.pem;
    ssl_certificate_key /tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:2m;
    ssl_session_timeout 10m;
    server_tokens off;
    sendfile on;
    gzip on;
    gzip_types application/javascript application/json application/wasm text/css image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control no-cache always;

    server {
        listen 8452 ssl default_server;
        server_name 46.62.223.67;
        root /srv/customer;
        location / { try_files $uri $uri/ /index.html; }
    }
    server {
        listen 8453 ssl default_server;
        server_name 46.62.223.67;
        client_max_body_size 6m;
        set $api api:8080;
        location / {
            proxy_pass http://$api;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
    server {
        listen 8454 ssl default_server;
        server_name 46.62.223.67;
        root /srv/merchant;
        location / { try_files $uri $uri/ /index.html; }
    }
    server {
        listen 8455 ssl default_server;
        server_name 46.62.223.67;
        root /srv/admin;
        location / { try_files $uri $uri/ /index.html; }
    }
}
